# The prospective arm.
#
# Runs daily, scores every universe member with today's data, and commits the result.
# The commit timestamp is the point: it shows the prediction preceded the outcome, and
# anyone can verify that without trusting us.
#
# Free on public repositories: GitHub-hosted standard runners have no minute cap there.
#
# One trap worth knowing: GitHub silently disables scheduled workflows on public repos
# after 60 days without repository activity. Daily commits from this job prevent that,
# but a long pause in the project would not.
name: seal predictions

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC daily
  workflow_dispatch:          # manual trigger, for the first run and for testing

permissions:
  contents: write

concurrency:
  group: seal
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Seal today's predictions
        env:
          # Explicit rather than implicit, so a re-run of a failed day can name its date.
          TRUTHLAG_DATE: ${{ github.event.inputs.date }}
        run: npx tsx src/prospective/seal.ts

      - name: Commit the sealed ledger
        run: |
          if [ -z "$(git status --porcelain predictions/)" ]; then
            echo "nothing new to seal"
            exit 0
          fi
          git config user.name  "truthlag prospective arm"
          git config user.email "noreply@github.com"
          git add predictions/
          DAY=$(ls predictions/*.jsonl | tail -1 | xargs basename | sed 's/.jsonl//')
          git commit -m "Seal predictions for ${DAY}

          Written before the outcomes existed. The timestamp on this commit is the
          evidence; seal_sha256 in the file header covers the prediction lines."
          git push
